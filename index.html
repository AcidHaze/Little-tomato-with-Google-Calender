<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小番茄 · 专注计时器</title>
<style>
:root{--pink:#ff9fce;--pink-dark:#f37db8;--mint:#8cebbb;--ink:#625c68;--paper:#fffdfd;--line:#f5dcea;--accent:#ff9fce;--tint:#8cebbb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f8f5f7;color:var(--ink);font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;display:grid;place-items:center;padding:20px}
.app{width:min(980px,100%);min-height:600px;position:relative;overflow:hidden;border-radius:22px;background:#fff;box-shadow:0 18px 60px #4933491c;isolation:isolate}
.app:before{content:"";position:absolute;inset:0;background-image:var(--wallpaper,linear-gradient(135deg,#fff9fc,#f8fbf9));background-position:center;background-size:cover;opacity:.5;z-index:-2}
.app:after{content:"";position:absolute;inset:0;background:#fff;opacity:0;z-index:-1;pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:24px 32px 12px;gap:12px}.brand{font-size:13px;letter-spacing:.14em;color:#b7a7b3;font-weight:700}.right{display:flex;align-items:center;gap:10px}
button{font:inherit;border:0;cursor:pointer;color:inherit}button:focus{outline:none}button:focus-visible{outline:2px solid #ed91bc;outline-offset:2px}.tab{padding:9px 15px;border-radius:999px;background:#fff9fc;color:#e58db9;font-weight:700;box-shadow:0 2px 9px #ebbed51f;transition:.18s}.tab:hover,.tab.active{background:#ffe6f2;color:#ec75ad}.calendar{padding:9px 13px;border-radius:999px;background:#fff;color:#817884;border:1px solid #f0e9ee;font-size:13px}.pip-button{padding:9px 12px;border-radius:999px;background:#fff;color:#817884;border:1px solid #f0e9ee;font-size:13px}.pip-button:hover{background:#fff4f9;color:#d878a7}.statusdot{display:inline-block;width:8px;height:8px;background:#8fd6a6;border-radius:50%;margin-right:6px}
.content{padding:20px 48px 29px;display:grid;grid-template-columns:1fr 1.1fr;gap:26px;align-items:center;min-height:470px}.details{align-self:start;padding-top:20px;max-width:340px}.field-label{font-size:13px;color:#ed8ab8;font-weight:700;margin:12px 0 7px}.title-input{width:100%;border:0;border-radius:999px;padding:11px 15px;background:#fff;outline:1px solid #f5e8ef;color:#5e5862;font-size:15px;box-shadow:0 2px 8px #87647a0d}.title-input:focus{outline:2px solid #ffc8e1}.tag-entry{display:flex;gap:7px;align-items:center}.tag-entry .title-input{min-width:0;flex:1}.tag-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.tag-chip{padding:5px 10px;border-radius:999px;background:#fff;border:1px solid #eee4eb;font-size:12px;color:#827785}.tag-chip.selected{border-color:var(--accent);color:#625965;box-shadow:0 0 0 1px var(--accent)}.color-link{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:11px;color:#a495a2}.color-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #fff,0 0 0 3px #eadfe7}.extras{margin-top:24px;display:flex;align-items:center;gap:9px}.quiet-button{font-size:12px;background:#fff;padding:8px 11px;border:1px solid #f0e7ed;border-radius:9px;color:#8c818b;white-space:nowrap}.quiet-button:hover{background:#fff4f9}
.timer-wrap{display:grid;place-items:center}.timer{--progress:0deg;width:min(350px,72vw);aspect-ratio:1;border-radius:50%;background:conic-gradient(from -90deg,var(--accent) var(--progress),#f5eaf0 var(--progress));padding:5px;filter:drop-shadow(0 8px 12px #d197b526)}.timer-inner{width:100%;height:100%;border-radius:50%;background:#fffdfd;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border:1px solid #fff}.phase{font-size:14px;color:var(--tint);font-weight:700;margin-bottom:7px}.clock{font-size:clamp(48px,7vw,76px);line-height:1;font-weight:300;letter-spacing:.03em;color:var(--tint);font-variant-numeric:tabular-nums}.main-action{margin-top:15px;background:#ffe4f1;color:#ee80b5;border-radius:999px;padding:9px 23px;font-size:18px;font-weight:700;min-width:96px}.main-action:hover{background:#ffd6e9}.secondary-actions{display:flex;gap:9px;margin-top:10px}.small-action{background:transparent;color:#ad9eaa;font-size:12px;text-decoration:underline;text-underline-offset:3px}.summary{text-align:center;padding:0 22px 24px;color:#b28aa0;font-size:13px}.summary strong{color:#dd8db4;font-weight:600}.hint{text-align:center;font-size:11px;color:#b9aeb7;padding-bottom:18px}
.panel{position:absolute;top:75px;left:32px;z-index:5;width:min(360px,calc(100% - 64px));background:#fff;border:1px solid #f4dfeb;border-radius:16px;box-shadow:0 16px 45px #62445b29;padding:18px;animation:pop .16s ease-out}.panel[hidden]{display:none}@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}.panel h2{font-size:14px;margin:0 0 15px;color:#c7749d}.setting-row{display:grid;grid-template-columns:1fr 98px;align-items:center;gap:10px;margin:11px 0;font-size:13px}.setting-row input{width:100%;border:1px solid #f2e5ec;border-radius:8px;padding:8px;background:#fffafd;color:#655b65;font:inherit}.panel-foot{font-size:11px;color:#aa9da8;margin-top:13px}.close-panel{float:right;background:none;color:#ae9ca9;font-size:18px;line-height:1}.file-input{display:none}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#534b56;color:white;border-radius:12px;padding:11px 16px;font-size:13px;box-shadow:0 8px 24px #30253130;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1}.modal-backdrop{position:fixed;inset:0;background:#26202a66;display:grid;place-items:center;z-index:9;padding:18px}.modal-backdrop[hidden]{display:none}.modal{width:min(390px,100%);border-radius:18px;background:#fff;padding:24px;box-shadow:0 20px 60px #20162045}.modal h2{margin:0 0 9px;font-size:17px}.modal p{font-size:13px;line-height:1.55;color:#8b818b}.modal-buttons{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.primary{background:#ed91bc;color:white;padding:9px 14px;border-radius:9px}.secondary{background:#f7f2f5;padding:9px 14px;border-radius:9px}
.tag-list{display:grid;gap:8px;max-height:260px;overflow:auto;margin:14px 0}.tag-row{display:grid;grid-template-columns:minmax(0,1fr) 96px 44px 32px;align-items:center;gap:7px}.tag-row input[type=text],.tag-row select,.tag-add input[type=text],.tag-add select{min-width:0;width:100%;border:1px solid #eee3eb;border-radius:8px;padding:8px;background:#fff;font:inherit;color:#635b65}.tag-row select,.tag-add select{font-size:12px}.tag-icon-button{height:34px;min-width:42px;border:1px solid #eee3eb;border-radius:8px;background:#fff;font-size:19px}.tag-icon-button:hover{background:#fff4f9;border-color:#f1c9dc}.tag-color{width:100%;height:34px;border-radius:8px;border:1px solid #eee3eb;background:#fff;padding:4px}.delete-tag{width:30px;height:30px;border-radius:8px;background:#fff4f7;color:#ca759a}.tag-add{display:grid;grid-template-columns:minmax(0,1fr) 118px auto;align-items:center;gap:8px}.modal-note{font-size:12px!important;color:#a495a2!important;margin:0}
.emoji-picker-backdrop{position:fixed;inset:0;z-index:12;display:grid;place-items:center;padding:16px;background:#26202a55}.emoji-picker-backdrop[hidden]{display:none}.emoji-picker{width:min(410px,100%);max-height:min(430px,90vh);display:flex;flex-direction:column;border:1px solid #e9e5e7;border-radius:13px;background:#fff;box-shadow:0 16px 42px #30253135;overflow:hidden}.emoji-tabs{height:42px;display:flex;align-items:stretch;border-bottom:1px solid #eee}.emoji-tab{padding:0 13px;background:none;color:#8a8388;font-size:13px}.emoji-tab.active{color:#302b30;border-bottom:2px solid #302b30}.emoji-search-row{display:flex;align-items:center;gap:8px;padding:9px 10px}.emoji-search{flex:1;min-width:0;border:1px solid #d9d5d8;border-radius:7px;padding:7px 9px;font:13px "Segoe UI","Microsoft YaHei UI",sans-serif;outline:none}.emoji-search:focus{border-color:#8e9eb0;box-shadow:0 0 0 2px #dce7f2}.emoji-clear{background:#f6f3f5;border-radius:7px;padding:7px 10px;color:#766e75;font-size:12px}.emoji-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;padding:4px 9px 10px;overflow:auto}.emoji-option{height:34px;border-radius:7px;background:#fff;font-size:21px}.emoji-option:hover,.emoji-option.selected{background:#f2eff1}.emoji-empty{grid-column:1/-1;padding:26px 0;text-align:center;color:#999;font-size:13px}.emoji-categories{display:flex;justify-content:space-around;gap:3px;padding:5px 7px;border-top:1px solid #eee;background:#fff}.emoji-category{width:31px;height:30px;border-radius:7px;background:transparent;color:#777;font-size:16px}.emoji-category.active,.emoji-category:hover{background:#f2eff1;color:#343036}
@media(max-width:700px){body{padding:0}.app{min-height:100vh;border-radius:0}.topbar{padding:18px 16px 6px;flex-wrap:wrap}.brand{display:none}.content{grid-template-columns:1fr;gap:10px;padding:10px 22px 18px;min-height:auto}.details{padding-top:8px;order:2;max-width:none}.timer-wrap{order:1}.timer{width:min(290px,73vw)}.summary{padding:10px 17px 12px;line-height:1.8}.hint{padding:0 15px 17px}.panel{top:63px;left:14px;width:calc(100% - 28px)}}
</style>
</head>
<body>
<main class="app" id="app">
 <header class="topbar">
  <div class="brand">小番茄 · 专注记录</div>
  <div class="right">
   <button class="tab active" id="pomodoroTab" aria-expanded="false">番茄钟</button>
   <button class="tab" id="stopwatchTab">正计时</button>
   <button class="pip-button" id="pipButton" title="悬浮计时器">画中画</button>
   <button class="calendar" id="calendarButton"><span class="statusdot"></span>Google 日历</button>
  </div>
 </header>
 <section class="content">
  <div class="details">
   <div class="field-label">活动名称</div>
   <input class="title-input" id="eventTitle" maxlength="100" placeholder="例如：改五十音软件中" value="">
   <div class="field-label">活动标签</div>
   <div class="tag-entry">
    <input class="title-input" id="tagInput" maxlength="30" placeholder="输入或选择标签" list="tagOptions" autocomplete="off">
    <datalist id="tagOptions"></datalist>
    <button class="quiet-button" id="tagManageButton">标签颜色</button>
   </div>
   <div class="tag-chips" id="tagChips"></div>
   <div class="color-link"><span class="color-dot" id="colorDot"></span><span id="colorStatus">选择标签后自动关联颜色</span></div>
   <div class="extras">
    <button class="quiet-button" id="uploadButton">上传底图</button>
    <button class="quiet-button" id="clearBackground" hidden>移除底图</button>
    <input type="file" id="backgroundFile" class="file-input" accept="image/*">
   </div>
  </div>
  <div class="timer-wrap">
   <div class="timer" id="timerRing" style="--progress:360deg">
    <div class="timer-inner">
     <div class="phase" id="phase">准备开始</div>
     <div class="clock" id="clock">25:00</div>
     <button class="main-action" id="mainAction">开始</button>
     <div class="secondary-actions" id="secondaryActions" hidden>
      <button class="small-action" id="resetButton">重置</button>
      <button class="small-action" id="finishButton">结束并记录</button>
      <button class="small-action" id="discardButton">放弃本轮</button>
     </div>
    </div>
   </div>
  </div>
 </section>
 <div class="summary" id="summary"></div>
 <div class="hint" id="hint">完成后创建一条覆盖整个番茄钟时段的 Google 日历活动</div>
 <section class="panel" id="settingsPanel" hidden>
  <button class="close-panel" id="closePanel" aria-label="关闭">×</button>
  <h2>番茄钟设置</h2>
  <label class="setting-row"><span>每轮专注（分钟）</span><input type="number" id="focusInput" min="1" max="240" value="25"></label>
  <label class="setting-row"><span>轮间休息（分钟）</span><input type="number" id="breakInput" min="0" max="120" value="5"></label>
  <label class="setting-row"><span>专注轮数</span><input type="number" id="roundsInput" min="1" max="16" value="4"></label>
  <label class="setting-row"><span>最后休息（分钟）</span><input type="number" id="finalBreakInput" min="0" max="240" value="20"></label>
  <div class="panel-foot">专注与休息会自动衔接；完成后写入一条完整日历活动。</div>
 </section>
</main>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="confirmModal" hidden>
 <div class="modal"><h2 id="modalTitle">结束这一轮？</h2><p id="modalText">可以记录这段时间，也可以放弃。</p><div class="modal-buttons"><button class="secondary" id="modalCancel">继续计时</button><button class="primary" id="modalConfirm">结束并记录</button></div></div>
</div>
<div class="modal-backdrop" id="tagManager" hidden>
 <div class="modal">
  <h2>标签颜色与图标</h2>
  <p class="modal-note">颜色可以由多个标签共用；图标可选。选中图标后，会加在记录名称前面。</p>
  <div class="tag-list" id="tagList"></div>
  <div class="tag-add"><input id="newTagName" type="text" maxlength="30" placeholder="新标签名称"><select id="newTagColor" aria-label="新标签颜色"></select><button class="primary" id="addTagButton">添加</button></div>
  <div class="modal-buttons"><button class="primary" id="closeTagManager">完成</button></div>
 </div>
</div>
<div class="emoji-picker-backdrop" id="emojiPicker" hidden>
 <section class="emoji-picker" role="dialog" aria-modal="true" aria-label="选择标签图标">
  <div class="emoji-tabs"><div class="emoji-tab active" aria-current="page">表情符号</div></div>
  <div class="emoji-search-row"><input class="emoji-search" id="emojiSearch" type="search" placeholder="⌕  筛选表情符号..." autocomplete="off"><button class="emoji-clear" id="clearTagEmoji" type="button">移除</button></div>
  <div class="emoji-grid" id="emojiGrid"></div>
  <div class="emoji-categories" id="emojiCategories"></div>
 </section>
</div>
<div class="modal-backdrop" id="sessionReminder" hidden>
 <div class="modal">
  <h2 id="sessionReminderTitle">本次计时已完成</h2>
  <p id="sessionReminderName"></p>
  <p id="sessionReminderTime"></p>
  <p class="modal-note">日期和时间已保存在本地记录中。打开 Google 日历草稿后，还需要点「保存」。</p>
  <div class="modal-buttons"><button class="secondary" id="closeSessionReminder">稍后</button><button class="primary" id="writeSessionToCalendar">写入 Google 日历</button></div>
 </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id), colors=[['#f474ac','粉色','4'],['#e5484d','红色','11'],['#e67c73','珊瑚','4'],['#f89b3c','橙色','6'],['#f2c94c','黄色','5'],['#46b978','绿色','10'],['#7ad5b2','薄荷','2'],['#46a5db','蓝色','7'],['#6279e8','靛蓝','9'],['#a75bd7','紫色','3'],['#a7a4ac','灰色','8']];
const defaultTagMap={'工作':'#f474ac','学习':'#f2c94c','画画':'#a75bd7','游戏':'#46b978','吃饭':'#46a5db','睡觉':'#46a5db','运动':'#46a5db'};
const emojiGroups=[['常用','🕒','😀','🌿','⚽','✈️','💡','☑️','⚑','▦','✚'],['表情','😀','😃','😄','😁','😆','😅','😂','🙂','😉','😊','😍','🥰','😎','🤔','😴','😭','😡','🤯','👻','💩'],['自然','🌱','🌿','🍀','🌸','🌻','🌈','☀️','🌙','⭐','🔥','💧','❄️','☁️','🌊','🍎','🍓','☕','🍵'],['活动','⚽','🏀','🎾','🎮','🎨','🎵','🎧','🎬','📚','✏️','📝','💻','📷','🎁','🏃','🚲','🧘'],['物品','💼','📌','📎','📅','⏰','🔔','🔑','💎','❤️','💛','💚','💙','💜','🖤','✨','✅','📍']];
const emojiKeywords={'💼':'工作 办公 职场','📚':'学习 读书 书本','🎨':'画画 绘画 艺术','🎮':'游戏 手柄','🍽️':'吃饭 用餐','🍓':'吃饭 水果','🌙':'睡觉 休息','😴':'睡觉 休息','🏃':'运动 跑步','⚽':'运动 足球','🕒':'时间 计时','💻':'电脑 工作','📝':'记录 写作','☕':'咖啡 休息'};
let mode='pomodoro',selectedColor=colors[0],selectedTag='',tagMap={...defaultTagMap},tagEmoji={},emojiPickerTag='',emojiCategory=0,running=false,paused=false,phase='focus',round=1,remaining=1500,phaseEndsAt=null,cycleStartedAt=null,sessionStartedAt=null,activeFocus=0,interval=null,stopwatchElapsed=0,stopwatchStartedAt=null,calendarDraftUrl=null,pipWindow=null,settings={focus:25,rest:5,rounds:4,last:20};
let wallpaperImage=null;
const fmt=s=>{s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
const toast=msg=>{let el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)};
function makeBackgroundCanvas(host,image){if(!host||!image||!image.naturalWidth)return null;let width=Math.max(1,Math.round(host.clientWidth)),height=Math.max(1,Math.round(host.clientHeight)),canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;let context=canvas.getContext('2d',{willReadFrequently:true});if(!context)return null;let scale=Math.max(width/image.naturalWidth,height/image.naturalHeight),sourceWidth=width/scale,sourceHeight=height/scale;context.drawImage(image,(image.naturalWidth-sourceWidth)/2,(image.naturalHeight-sourceHeight)/2,sourceWidth,sourceHeight,0,0,width,height);return canvas}
function sampleDisplayedLuminance(element,host,canvas){let rect=element.getBoundingClientRect(),hostRect=host.getBoundingClientRect(),context=canvas?.getContext('2d',{willReadFrequently:true});if(!context||!rect.width||!rect.height)return 1;let xs=[.2,.5,.8],ys=[.25,.5,.75],sum=0,count=0;for(let y of ys)for(let x of xs){let px=Math.max(0,Math.min(canvas.width-1,Math.round(rect.left-hostRect.left+rect.width*x))),py=Math.max(0,Math.min(canvas.height-1,Math.round(rect.top-hostRect.top+rect.height*y)));let [r,g,b]=context.getImageData(px,py,1,1).data;let blended=[r*.5+127.5,g*.5+127.5,b*.5+127.5].map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4});sum+=.2126*blended[0]+.7152*blended[1]+.0722*blended[2];count++}return count?sum/count:1}
function setAdaptiveTextColor(element,luminance,forceWhite=false){let light=forceWhite||luminance<.29;element.style.color=light?'#fff':'#514851';element.style.textShadow=light?'0 1px 3px rgba(38,28,39,.82), 0 0 1px rgba(38,28,39,.75)':'0 1px 2px rgba(255,255,255,.9)'}
function applyBackgroundTextContrast(){let app=$('app'),targets=[...app.querySelectorAll('.brand,.field-label,.color-link,.summary,.summary strong,.hint')];if(!wallpaperImage){for(let el of targets){el.style.color='';el.style.textShadow=''}return}let canvas=makeBackgroundCanvas(app,wallpaperImage);if(!canvas)return;for(let el of targets)setAdaptiveTextColor(el,sampleDisplayedLuminance(el,app,canvas),el.classList.contains('brand'))}
function updatePipTextContrast(){if(!pipWindow||pipWindow.closed)return;let doc=pipWindow.document,card=doc.getElementById('pipCard'),title=doc.getElementById('pipTitle'),tag=doc.getElementById('pipTag');if(!card||!title||!tag)return;if(!wallpaperImage){title.style.color=selectedColor[0];title.style.textShadow='';tag.style.color='';tag.style.textShadow='';return}let canvas=makeBackgroundCanvas(card,wallpaperImage);if(!canvas)return;setAdaptiveTextColor(title,sampleDisplayedLuminance(title,card,canvas));setAdaptiveTextColor(tag,sampleDisplayedLuminance(tag,card,canvas))}
function setWallpaper(dataUrl){if(!dataUrl){wallpaperImage=null;applyBackgroundTextContrast();updatePipTextContrast();return}let image=new Image();image.onload=()=>{wallpaperImage=image;applyBackgroundTextContrast();updatePipTextContrast()};image.src=dataUrl}
function load(){try{let s=JSON.parse(localStorage.getItem('pomodoroSettings')||'{}');Object.assign(settings,s);$('eventTitle').value=localStorage.getItem('eventTitle')||'';let storedTags=JSON.parse(localStorage.getItem('tagMap')||'null');if(storedTags&&typeof storedTags==='object')tagMap=storedTags;let storedEmoji=JSON.parse(localStorage.getItem('tagEmoji')||'{}');if(storedEmoji&&typeof storedEmoji==='object')tagEmoji=storedEmoji;selectedTag=localStorage.getItem('selectedTag')||'';selectedColor=colors.find(c=>c[0]===localStorage.getItem('eventColor'))||colors[0];if(tagMap[selectedTag])selectedColor=colors.find(c=>c[0]===tagMap[selectedTag])||selectedColor;let bg=localStorage.getItem('timerBg');if(bg){$('app').style.setProperty('--wallpaper',`url("${bg}")`);$('clearBackground').hidden=false;setWallpaper(bg)}}catch{}}
function save(){localStorage.setItem('pomodoroSettings',JSON.stringify(settings));localStorage.setItem('eventTitle',$('eventTitle').value);localStorage.setItem('eventColor',selectedColor[0]);localStorage.setItem('selectedTag',selectedTag);localStorage.setItem('tagMap',JSON.stringify(tagMap));localStorage.setItem('tagEmoji',JSON.stringify(tagEmoji))}
function setSelectedColor(hex){selectedColor=colors.find(c=>c[0]===hex)||colors[0];$('app').style.setProperty('--accent',selectedColor[0]);$('timerRing').style.setProperty('--accent',selectedColor[0]);$('clock').style.color=selectedColor[0];$('colorDot').style.background=selectedColor[0]}
function updateTagColorStatus(){let name=selectedTag&&tagMap[selectedTag]?`「${selectedTag}」已关联${selectedColor[1]}色`:'此标签尚未设置颜色映射';$('colorStatus').textContent=selectedTag?name:'选择标签后自动关联颜色';$('colorDot').style.background=selectedColor[0]}
function activityTitle(){let title=$('eventTitle').value.trim()||'专注',emoji=selectedTag?tagEmoji[selectedTag]:'';return emoji?`${emoji} ${title}`:title}
function applyTag(name){let key=Object.keys(tagMap).find(t=>t.toLocaleLowerCase()===name.trim().toLocaleLowerCase());selectedTag=key||'';if(key)setSelectedColor(tagMap[key]);updateTagColorStatus();renderTagChips();save()}
function renderTagChips(){let root=$('tagChips'),list=$('tagOptions');root.innerHTML='';list.innerHTML='';for(const name of Object.keys(tagMap)){let option=document.createElement('option');option.value=name;list.append(option);let b=document.createElement('button');b.type='button';b.className='tag-chip'+(name===selectedTag?' selected':'');b.textContent=tagEmoji[name]?`${tagEmoji[name]} ${name}`:name;b.style.setProperty('--accent',tagMap[name]);b.onclick=()=>{$('tagInput').value=name;applyTag(name)};root.append(b)}}
function renderTagManager(){let root=$('tagList');root.innerHTML='';for(const name of Object.keys(tagMap)){let row=document.createElement('div');row.className='tag-row';let nameInput=document.createElement('input');nameInput.type='text';nameInput.maxLength=30;nameInput.value=name;nameInput.setAttribute('aria-label',`${name}标签名称`);let colorSelect=document.createElement('select');colorSelect.setAttribute('aria-label',`${name}标签颜色`);for(const c of colors){let op=document.createElement('option');op.value=c[0];op.textContent=c[1];op.selected=c[0]===tagMap[name];colorSelect.append(op)}let iconButton=document.createElement('button');iconButton.type='button';iconButton.className='tag-icon-button';iconButton.textContent=tagEmoji[name]||'＋';iconButton.title=tagEmoji[name]?`修改${name}图标`:`为${name}选择图标`;iconButton.setAttribute('aria-label',iconButton.title);iconButton.onclick=()=>openEmojiPicker(name);let del=document.createElement('button');del.className='delete-tag';del.textContent='×';del.title=`删除${name}`;nameInput.onchange=()=>{let next=nameInput.value.trim();if(!next||next!==name&&tagMap[next]){toast('标签名称不能为空，也不能重复');renderTagManager();return}if(next!==name){tagMap[next]=tagMap[name];delete tagMap[name];if(tagEmoji[name])tagEmoji[next]=tagEmoji[name];delete tagEmoji[name];if(selectedTag===name){selectedTag=next;$('tagInput').value=next}save();renderTagChips();updateTagColorStatus();renderTagManager()}};colorSelect.onchange=()=>{tagMap[name]=colorSelect.value;if(selectedTag===name)setSelectedColor(colorSelect.value);save();renderTagChips();updateTagColorStatus()};del.onclick=()=>{delete tagMap[name];delete tagEmoji[name];if(selectedTag===name){selectedTag='';$('tagInput').value='';setSelectedColor(colors[0][0])}save();renderTagManager();renderTagChips();updateTagColorStatus()};row.append(nameInput,colorSelect,iconButton,del);root.append(row)}}
function openEmojiPicker(tag){emojiPickerTag=tag;emojiCategory=0;$('emojiSearch').value='';renderEmojiPicker();$('emojiPicker').hidden=false}
function renderEmojiPicker(){let grid=$('emojiGrid'),search=$('emojiSearch').value.trim().toLocaleLowerCase(),group=emojiGroups[emojiCategory],items=group.slice(1);if(search)items=emojiGroups.slice(1).flatMap(g=>g.slice(1)).filter((emoji,index,array)=>array.indexOf(emoji)===index&&(emoji.includes(search)||(emojiKeywords[emoji]||'').includes(search)));grid.innerHTML='';if(!items.length){let empty=document.createElement('div');empty.className='emoji-empty';empty.textContent='没有找到匹配的表情符号';grid.append(empty)}for(const emoji of items){let b=document.createElement('button');b.type='button';b.className='emoji-option'+(tagEmoji[emojiPickerTag]===emoji?' selected':'');b.textContent=emoji;b.title=emojiKeywords[emoji]||emoji;b.onclick=()=>{tagEmoji[emojiPickerTag]=emoji;save();$('emojiPicker').hidden=true;renderTagManager();renderTagChips();syncPip()};grid.append(b)}let categories=$('emojiCategories');categories.innerHTML='';for(let i=0;i<emojiGroups.length;i++){let b=document.createElement('button');b.type='button';b.className='emoji-category'+(i===emojiCategory?' active':'');b.textContent=emojiGroups[i][0]==='常用'?'◷':emojiGroups[i][0]==='表情'?'☻':emojiGroups[i][0]==='自然'?'♧':emojiGroups[i][0]==='活动'?'⚽':'▦';b.title=emojiGroups[i][0];b.onclick=()=>{emojiCategory=i;$('emojiSearch').value='';renderEmojiPicker()};categories.append(b)}}
function addTag(){let name=$('newTagName').value.trim();if(!name){toast('先填写标签名称');return}if(tagMap[name]){toast('这个标签已经存在');return}tagMap[name]=$('newTagColor').value;$('newTagName').value='';save();renderTagManager();renderTagChips();$('tagInput').value=name;applyTag(name)}
function updateSummary(){if(mode==='pomodoro')$('summary').innerHTML=`专注 <strong>${settings.focus} 分钟</strong> · 间歇 <strong>${settings.rest} 分钟</strong>　共 <strong>${settings.rounds} 轮</strong> · 最后休息 <strong>${settings.last} 分钟</strong>`;else $('summary').innerHTML='正计时 · 手动结束后创建日历活动'}
function tick(){if(mode==='stopwatch'){let elapsed=stopwatchElapsed+(running?Math.floor((Date.now()-stopwatchStartedAt)/1000):0);$('clock').textContent=fmt(elapsed);$('phase').textContent='正计时';let lapProgress=(elapsed%3600)/3600*360;$('timerRing').style.setProperty('--progress',`${lapProgress}deg`);syncPip();return}if(running&&phaseEndsAt!==null){remaining=Math.max(0,Math.ceil((phaseEndsAt-Date.now())/1000));if(remaining<=0){advancePhase();return}}$('clock').textContent=fmt(remaining);let total=(phase==='focus'?settings.focus:(round===settings.rounds?settings.last:settings.rest))*60;let left=remaining/Math.max(1,total);$('timerRing').style.setProperty('--progress',`${Math.min(360,Math.max(0,left*360))}deg`);syncPip()}
function render(){let btn=$('mainAction'),sec=$('secondaryActions');sec.hidden=!running&&!paused;if(mode==='pomodoro'){if(!running&&!paused){phase='focus';round=1;remaining=settings.focus*60;$('phase').textContent='准备开始';btn.textContent='开始'}else{btn.textContent=paused?'继续':'暂停';$('phase').textContent=phase==='focus'?`专注 ${round}/${settings.rounds}`:round===settings.rounds?'最后休息':'休息时间';}}else{btn.textContent=running?'暂停':paused?'继续':'开始';$('phase').textContent='正计时';if(!running&&!paused)$('clock').textContent='00:00'}$('pomodoroTab').classList.toggle('active',mode==='pomodoro');$('stopwatchTab').classList.toggle('active',mode==='stopwatch');$('pomodoroTab').setAttribute('aria-expanded',String(!$('settingsPanel').hidden));$('calendarButton').innerHTML='<span class="statusdot"></span>Google 日历';updateSummary();if(mode==='pomodoro'&&!running&&!paused)tick();else syncPip()}
function start(){if(!running&&!paused){sessionStartedAt=new Date();cycleStartedAt=sessionStartedAt;if(mode==='pomodoro'){phase='focus';round=1;remaining=settings.focus*60;activeFocus=0}else{stopwatchElapsed=0;stopwatchStartedAt=Date.now()}}else if(paused){if(mode==='stopwatch')stopwatchStartedAt=Date.now()}if(mode==='pomodoro')phaseEndsAt=Date.now()+remaining*1000;running=true;paused=false;clearInterval(interval);interval=setInterval(tick,250);render()}
function pause(){if(mode==='stopwatch'){stopwatchElapsed+=Math.floor((Date.now()-stopwatchStartedAt)/1000)}else if(phaseEndsAt!==null){remaining=Math.max(0,Math.ceil((phaseEndsAt-Date.now())/1000));phaseEndsAt=null}running=false;paused=true;clearInterval(interval);tick();render()}
function advancePhase(){if(phase==='focus'){activeFocus+=settings.focus*60;if(round<settings.rounds){phase='break';remaining=settings.rest*60}else{phase='last';remaining=settings.last*60}if(remaining<=0){advancePhase();return}toast(phase==='break'?'专注完成，开始休息':'专注完成，开始最后休息')}else if(phase==='break'){round++;phase='focus';remaining=settings.focus*60;toast(`休息结束，开始第 ${round} 轮`)}else{completeSession();return}phaseEndsAt=Date.now()+remaining*1000;tick();render()}
function localDateTime(d){return `${d.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'})} ${d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}`}
function recordSession(start,end,focusSeconds){let title=activityTitle(),url=buildCalendarUrl(start,end,focusSeconds),record={id:Date.now(),title,tag:selectedTag,type:mode,start:start.toISOString(),end:end.toISOString(),focusSeconds,color:selectedColor[0],calendarUrl:url};let history=[];try{history=JSON.parse(localStorage.getItem('timerSessions')||'[]')}catch{}history.unshift(record);try{localStorage.setItem('timerSessions',JSON.stringify(history.slice(0,200)))}catch{toast('本次计时已完成，但本地记录未能保存')}calendarDraftUrl=url;$('sessionReminderTitle').textContent=mode==='pomodoro'?'番茄钟已完成':'正计时已结束';$('sessionReminderName').textContent=`${title}${selectedTag?` · ${selectedTag}`:''}`;$('sessionReminderTime').textContent=`${localDateTime(start)} — ${localDateTime(end)}`;$('sessionReminder').hidden=false}
function completeSession(){running=false;paused=false;phaseEndsAt=null;clearInterval(interval);const end=new Date();recordSession(sessionStartedAt||end,end,activeFocus);$('phase').textContent='番茄钟完成';$('clock').textContent='完成';sessionStartedAt=null;activeFocus=0;phase='focus';round=1;remaining=settings.focus*60;setTimeout(()=>{if(!running&&!paused)render()},2200)}
function buildCalendarUrl(start,end,focusSeconds){let title=activityTitle();let tagNote=selectedTag?`标签：${selectedTag}。`:'',description=mode==='pomodoro'?`${tagNote}番茄钟｜${settings.rounds} 轮专注，共专注 ${Math.floor(focusSeconds/60)} 分钟；日历时段包含中间休息。`:`${tagNote}正计时专注`;let fmtDate=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let url=new URL('https://calendar.google.com/calendar/render');url.searchParams.set('action','TEMPLATE');url.searchParams.set('text',title);url.searchParams.set('dates',`${fmtDate(start)}/${fmtDate(end)}`);url.searchParams.set('details',description);url.searchParams.set('colorId',selectedColor[2]);return url.toString()}
function openCalendarEvent(start,end,focusSeconds){calendarDraftUrl=buildCalendarUrl(start,end,focusSeconds);window.open(calendarDraftUrl,'_blank','noopener');$('calendarButton').innerHTML='<span class="statusdot"></span>写入 Google 日历';toast('已打开 Google 日历活动草稿，请检查并保存')}
function finish(){if(!sessionStartedAt)return;if(mode==='pomodoro'&&running&&phaseEndsAt!==null)remaining=Math.max(0,Math.ceil((phaseEndsAt-Date.now())/1000));let end=new Date(),focusSeconds=mode==='stopwatch'?stopwatchElapsed+(running?Math.floor((Date.now()-stopwatchStartedAt)/1000):0):activeFocus+(phase==='focus'?Math.max(0,settings.focus*60-remaining):0);running=false;paused=false;phaseEndsAt=null;clearInterval(interval);recordSession(sessionStartedAt,end,focusSeconds);sessionStartedAt=null;activeFocus=0;stopwatchElapsed=0;remaining=settings.focus*60;render()}
function discard(){running=false;paused=false;phaseEndsAt=null;clearInterval(interval);sessionStartedAt=null;activeFocus=0;stopwatchElapsed=0;remaining=settings.focus*60;phase='focus';round=1;render();toast('本次计时已放弃')}
function syncPip(){if(!pipWindow||pipWindow.closed)return;let doc=pipWindow.document,clock=doc.getElementById('pipClock');if(!clock)return;let isStopwatch=mode==='stopwatch';doc.getElementById('pipPhase').textContent=isStopwatch?'正计时':$('phase').textContent;clock.textContent=$('clock').textContent;doc.getElementById('pipTitle').textContent=activityTitle();doc.getElementById('pipTag').textContent=selectedTag?`· ${selectedTag}`:'';let action=doc.getElementById('pipAction');action.textContent=running?'暂停':paused?'继续':'开始';doc.getElementById('pipFinish').hidden=!sessionStartedAt;let ring=doc.getElementById('pipRing');ring.style.setProperty('--progress',$('timerRing').style.getPropertyValue('--progress')||'360deg');ring.style.setProperty('--accent',selectedColor[0]);doc.documentElement.style.setProperty('--accent',selectedColor[0]);doc.getElementById('pipAction').style.color=selectedColor[0];if(!wallpaperImage)doc.getElementById('pipTitle').style.color=selectedColor[0];let bgLayer=doc.getElementById('pipBg'),bg=localStorage.getItem('timerBg');if(bgLayer)bgLayer.style.backgroundImage=bg?`url("${bg}")`:'none'}
async function openPip(){if(pipWindow&&!pipWindow.closed){pipWindow.close();return}if(!window.documentPictureInPicture){toast('当前浏览器不支持网页画中画，请用新版 Chrome 或 Edge');return}try{pipWindow=await window.documentPictureInPicture.requestWindow({width:320,height:350,preferInitialWindowPlacement:true});let doc=pipWindow.document;doc.title='小番茄 · 悬浮计时';doc.head.innerHTML=`<meta charset="utf-8"><style>:root{--accent:#f474ac}*{box-sizing:border-box}body{margin:0;padding:16px;background:#fff8fc;color:#625c68;font-family:"Segoe UI","Microsoft YaHei UI",sans-serif}.card{height:100%;min-height:306px;position:relative;isolation:isolate;overflow:hidden;border:1px solid #f2dce8;border-radius:20px;background:#fff;box-shadow:0 6px 24px #49334916;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.pip-bg{position:absolute;inset:0;z-index:-1;background-position:center;background-size:cover;opacity:.5}.activity{max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;color:var(--accent)}.tag{font-size:11px;color:#a99ba6;margin-top:3px}.ring{--progress:360deg;width:176px;height:176px;margin:12px auto;border-radius:50%;padding:5px;background:conic-gradient(from -90deg,var(--accent) var(--progress),#f5eaf0 var(--progress));display:grid;place-items:center}.inner{width:100%;height:100%;border-radius:50%;background:#fffdfd;display:flex;flex-direction:column;align-items:center;justify-content:center}.phase{font-size:12px;color:#8cebbb;font-weight:700;margin-bottom:5px}.clock{font-size:42px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}button{font:inherit;border:0;cursor:pointer}.action{margin-top:10px;padding:8px 24px;border-radius:999px;background:#ffe4f1;color:var(--accent);font-weight:700;font-size:15px}.finish{margin-top:9px;background:transparent;color:#a99ba6;text-decoration:underline;font-size:12px}.finish[hidden]{display:none}</style>`;doc.body.innerHTML=`<main class="card" id="pipCard"><div class="pip-bg" id="pipBg"></div><div class="activity" id="pipTitle">小番茄</div><div class="tag" id="pipTag"></div><div class="ring" id="pipRing"><div class="inner"><div class="phase" id="pipPhase"></div><div class="clock" id="pipClock">25:00</div><button class="action" id="pipAction">开始</button></div></div><button class="finish" id="pipFinish" hidden>结束并记录</button></main>`;doc.getElementById('pipAction').onclick=()=>running?pause():start();doc.getElementById('pipFinish').onclick=finish;pipWindow.addEventListener('pagehide',()=>{pipWindow=null;$('pipButton').textContent='画中画'});$('pipButton').textContent='退出画中画';syncPip();updatePipTextContrast()}catch(error){pipWindow=null;toast('无法打开画中画，请在新版 Chrome 或 Edge 中重试')}}
$('pipButton').onclick=openPip;
window.addEventListener('resize',()=>{applyBackgroundTextContrast();updatePipTextContrast()});
$('pomodoroTab').onclick=()=>{if(running||paused){if(mode!=='pomodoro'){toast('请先结束当前计时');return}}else{mode='pomodoro';$('settingsPanel').hidden=!$('settingsPanel').hidden;render()}};
$('stopwatchTab').onclick=()=>{if(running||paused){if(mode!=='stopwatch'){toast('请先结束当前计时');return}}else{mode='stopwatch';$('settingsPanel').hidden=true;render();tick()}};
$('closePanel').onclick=()=>$('settingsPanel').hidden=true;
for(const [id,key] of [['focusInput','focus'],['breakInput','rest'],['roundsInput','rounds'],['finalBreakInput','last']])$(id).onchange=e=>{let min=key==='rounds'?1:0,max=key==='rounds'?16:240;settings[key]=Math.min(max,Math.max(min,parseInt(e.target.value)||min));e.target.value=settings[key];save();render()};
$('mainAction').onclick=()=>running?pause():start();$('resetButton').onclick=discard;$('finishButton').onclick=finish;$('discardButton').onclick=discard;
$('eventTitle').oninput=()=>{save();syncPip()};
$('tagInput').oninput=()=>{let typed=$('tagInput').value.trim(),key=Object.keys(tagMap).find(t=>t.toLocaleLowerCase()===typed.toLocaleLowerCase());if(key)applyTag(key);else{selectedTag='';renderTagChips();updateTagColorStatus();save()}};
$('tagInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();let key=Object.keys(tagMap).find(t=>t.toLocaleLowerCase()===$('tagInput').value.trim().toLocaleLowerCase());if(key)applyTag(key);else toast('还没有这个标签，可以在「标签颜色」里添加并设置颜色')}};
$('tagManageButton').onclick=()=>{renderTagManager();$('tagManager').hidden=false};$('closeTagManager').onclick=()=>$('tagManager').hidden=true;$('addTagButton').onclick=addTag;
$('emojiSearch').oninput=renderEmojiPicker;$('clearTagEmoji').onclick=()=>{if(emojiPickerTag)delete tagEmoji[emojiPickerTag];save();$('emojiPicker').hidden=true;renderTagManager();syncPip()};$('emojiPicker').onclick=e=>{if(e.target===$('emojiPicker'))$('emojiPicker').hidden=true};
$('closeSessionReminder').onclick=()=>$('sessionReminder').hidden=true;$('writeSessionToCalendar').onclick=()=>{if(calendarDraftUrl)window.open(calendarDraftUrl,'_blank','noopener');$('sessionReminder').hidden=true;toast('已打开 Google 日历草稿，请检查后保存')};
$('uploadButton').onclick=()=>$('backgroundFile').click();$('backgroundFile').onchange=e=>{let file=e.target.files[0];if(!file)return;if(file.size>5*1024*1024){toast('图片请小于 5 MB');return}let reader=new FileReader();reader.onload=()=>{try{localStorage.setItem('timerBg',reader.result);$('app').style.setProperty('--wallpaper',`url("${reader.result}")`);$('clearBackground').hidden=false;setWallpaper(reader.result);toast('底图已更新')}catch{toast('图片过大，无法保存到本地设置')}};reader.readAsDataURL(file)};$('clearBackground').onclick=()=>{localStorage.removeItem('timerBg');$('app').style.removeProperty('--wallpaper');$('clearBackground').hidden=true;setWallpaper(null)};$('calendarButton').onclick=()=>calendarDraftUrl?(window.open(calendarDraftUrl,'_blank','noopener'),toast('请在 Google 日历中保存活动')):toast('计时完成后，点击这里写入 Google 日历');
load();$('focusInput').value=settings.focus;$('breakInput').value=settings.rest;$('roundsInput').value=settings.rounds;$('finalBreakInput').value=settings.last;for(const c of colors){let op=document.createElement('option');op.value=c[0];op.textContent=c[1];$('newTagColor').append(op)}$('newTagColor').value=colors[7][0];$('tagInput').value=selectedTag;setSelectedColor(selectedColor[0]);renderTagChips();updateTagColorStatus();updateSummary();render();
})();
